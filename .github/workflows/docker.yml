name: Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-amd64:
    name: Build and smoke test (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

      - name: Smoke test (binary must start, not panic)
        run: |
          set -euo pipefail
          out=$(docker run --rm "${IMAGE}:${GITHUB_REF_NAME}-amd64" version)
          echo "$out"
          echo "$out" | grep -q "^ogcode ${GITHUB_REF_NAME} " || {
            echo "unexpected version output" >&2
            exit 1
          }

      # Push the exact image that passed the smoke test; it is not rebuilt.
      - name: Push tested amd64 image
        run: docker push "${IMAGE}:${GITHUB_REF_NAME}-amd64"

  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64

  manifest:
    name: Publish multi-architecture tags
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest tags
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:${major_minor}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"
