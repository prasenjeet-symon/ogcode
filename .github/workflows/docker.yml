name: Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Docker Hub mirror. These are repository secrets; when they are unset (e.g. in
  # a fork) DOCKERHUB_USERNAME is empty and every Docker Hub step is skipped.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ogcode

jobs:
  build-amd64:
    name: Build and smoke test (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

      - name: Smoke test (binary must start, not panic)
        run: |
          set -euo pipefail
          out=$(docker run --rm "${IMAGE}:${GITHUB_REF_NAME}-amd64" version)
          echo "$out"
          echo "$out" | grep -q "^ogcode ${GITHUB_REF_NAME} " || {
            echo "unexpected version output" >&2
            exit 1
          }

      # Push the exact image that passed the smoke test; it is not rebuilt.
      - name: Push tested amd64 image
        run: docker push "${IMAGE}:${GITHUB_REF_NAME}-amd64"

      - name: Push amd64 image to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${GITHUB_REF_NAME}-amd64" "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-amd64"
          docker push "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-amd64"

  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64

      - name: Push arm64 image to GitHub Container Registry
        run: docker push "${IMAGE}:${GITHUB_REF_NAME}-arm64"

      - name: Push arm64 image to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${GITHUB_REF_NAME}-arm64" "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker push "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-arm64"

  manifest:
    name: Publish multi-architecture tags
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest tags
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:${major_minor}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"

      # Both sources and destinations are Docker Hub, so the manifests are
      # self-contained: the per-arch blobs are already in this registry.
      - name: Create and push Docker Hub manifest tags
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:${version}" \
            --tag "${DOCKERHUB_IMAGE}:${major_minor}" \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-arm64"
