<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img">
<rect width="960" height="300" fill="#151414"/>
<text x="78" y="30" fill="#fffbf5" font-size="14" font-weight="600" letter-spacing="0.5">Tokens a 137-page .docx puts in front of the model</text>
<text x="882" y="30" fill="#9a9390" font-size="12" text-anchor="end">68,886 words, 502,276 characters</text>

<text x="68" y="103" fill="#9a9390" font-size="12.5" text-anchor="end">&#160;</text>
<text x="78" y="103" fill="#fffbf5" font-size="12.5">Whole document, dumped</text>
<rect x="330" y="85" width="400" height="30" rx="3" fill="#ff5e1f"/>
<text x="744" y="103" fill="#fffbf5" font-size="12.5">&#8776;125,600, every turn</text>

<text x="68" y="167" fill="#9a9390" font-size="12.5" text-anchor="end">&#160;</text>
<text x="78" y="167" fill="#fffbf5" font-size="12.5">Index prompt, once</text>
<rect x="330" y="149" width="126" height="30" rx="3" fill="#ff7038"/>
<text x="470" y="167" fill="#fffbf5" font-size="12.5">&#8776;39,600 for the whole file</text>

<text x="68" y="231" fill="#9a9390" font-size="12.5" text-anchor="end">&#160;</text>
<text x="78" y="231" fill="#fffbf5" font-size="12.5">One page, on demand</text>
<rect x="330" y="213" width="7" height="30" rx="3" fill="#ff7038" opacity="0.8"/>
<text x="351" y="231" fill="#fffbf5" font-size="12.5">&#8776;840, the page you can cite</text>

<text x="78" y="272" fill="#9a9390" font-size="12">Tokens are characters &#247; 4. Over ten questions: the dump carries &#8776;1,255,600; the index plus ten pages, &#8776;48,000.</text>
</svg>
