<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="t d">
<title id="t">Chart of the input length at which six studies found quality falling</title>
<desc id="d">Six published studies plotted on one log scale of request size. Levy found accuracy dropping from 0.92 to 0.68 by about 3,000 tokens. Du found answers failing with perfect retrieval at 30,000. RULER, NoLiMa and Databricks all place the turning point for current models at 32,000, and GPT-4-0125 at 64,000. An Ogcode step sits around 5,000 to 20,000 tokens; the windows these models advertise run to 128,000 and beyond.</desc>
<rect width="960" height="100%" fill="#151414"/>
<text x="40.0" y="36.0" fill="#fffbf5" font-size="15" font-weight="600" letter-spacing="0.3">Where quality starts to slide, on one axis</text>
<text x="40.0" y="58.0" fill="#9a9390" font-size="12">Each dot is the input length at which a published study found performance falling</text>
<rect x="546.2" y="128" width="69.2" height="182" fill="#ff5e1f" opacity="0.13"/>
<line x1="546.2" y1="128" x2="546.2" y2="310" stroke="#ff5e1f" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
<line x1="615.4" y1="128" x2="615.4" y2="310" stroke="#ff5e1f" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
<text x="580.8" y="118.0" fill="#ff7038" font-size="10.5" text-anchor="middle">four of six land here</text>
<line x1="200" y1="152" x2="890" y2="152" stroke="#2a2725" stroke-width="1"/>
<text x="186.0" y="156.0" fill="#fffbf5" font-size="11.5" text-anchor="end">Levy</text>
<circle cx="309.7" cy="152" r="5" fill="#ff5e1f"/>
<text x="322.7" y="156" fill="#9a9390" font-size="11.5"><tspan fill="#fffbf5" font-weight="600">3K</tspan>  longer input alone: 0.92 to 0.68</text>
<line x1="200" y1="182" x2="890" y2="182" stroke="#2a2725" stroke-width="1"/>
<text x="186.0" y="186.0" fill="#fffbf5" font-size="11.5" text-anchor="end">Du</text>
<circle cx="539.7" cy="182" r="5" fill="#ff5e1f"/>
<text x="552.7" y="186" fill="#9a9390" font-size="11.5"><tspan fill="#fffbf5" font-weight="600">30K</tspan>  perfect retrieval, answers still wrong</text>
<line x1="200" y1="212" x2="890" y2="212" stroke="#2a2725" stroke-width="1"/>
<text x="186.0" y="216.0" fill="#fffbf5" font-size="11.5" text-anchor="end">RULER</text>
<circle cx="546.2" cy="212" r="5" fill="#ff5e1f"/>
<text x="559.2" y="216" fill="#9a9390" font-size="11.5"><tspan fill="#fffbf5" font-weight="600">32K</tspan>  only half of 17 models hold up</text>
<line x1="200" y1="242" x2="890" y2="242" stroke="#2a2725" stroke-width="1"/>
<text x="186.0" y="246.0" fill="#fffbf5" font-size="11.5" text-anchor="end">NoLiMa</text>
<circle cx="546.2" cy="242" r="5" fill="#ff5e1f"/>
<text x="559.2" y="246" fill="#9a9390" font-size="11.5"><tspan fill="#fffbf5" font-weight="600">32K</tspan>  11 of 13 fall below half their score</text>
<line x1="200" y1="272" x2="890" y2="272" stroke="#2a2725" stroke-width="1"/>
<text x="186.0" y="276.0" fill="#fffbf5" font-size="11.5" text-anchor="end">Llama-3.1-405B</text>
<circle cx="546.2" cy="272" r="5" fill="#ff5e1f"/>
<text x="559.2" y="276" fill="#9a9390" font-size="11.5"><tspan fill="#fffbf5" font-weight="600">32K</tspan>  peaks here, then declines</text>
<line x1="200" y1="302" x2="890" y2="302" stroke="#2a2725" stroke-width="1"/>
<text x="186.0" y="306.0" fill="#fffbf5" font-size="11.5" text-anchor="end">GPT-4-0125</text>
<circle cx="615.4" cy="302" r="5" fill="#ff5e1f"/>
<text x="628.4" y="306" fill="#9a9390" font-size="11.5"><tspan fill="#fffbf5" font-weight="600">64K</tspan>  peaks here, then declines</text>
<line x1="200" y1="340" x2="890" y2="340" stroke="#6b6462" stroke-width="1"/>
<line x1="200.0" y1="340" x2="200.0" y2="346" stroke="#6b6462" stroke-width="1"/>
<text x="200.0" y="362.0" fill="#9a9390" font-size="11.5" text-anchor="middle">1K</text>
<line x1="430.0" y1="340" x2="430.0" y2="346" stroke="#6b6462" stroke-width="1"/>
<text x="430.0" y="362.0" fill="#9a9390" font-size="11.5" text-anchor="middle">10K</text>
<line x1="660.0" y1="340" x2="660.0" y2="346" stroke="#6b6462" stroke-width="1"/>
<text x="660.0" y="362.0" fill="#9a9390" font-size="11.5" text-anchor="middle">100K</text>
<line x1="890.0" y1="340" x2="890.0" y2="346" stroke="#6b6462" stroke-width="1"/>
<text x="890.0" y="362.0" fill="#9a9390" font-size="11.5" text-anchor="middle">1M</text>
<text x="890.0" y="382.0" fill="#6b6462" font-size="10.5" text-anchor="end">tokens in one request</text>
<path d="M360.8,392 L360.8,398 L499.2,398 L499.2,392" stroke="#ff7038" stroke-width="1.5" fill="none"/>
<text x="430.0" y="414.0" fill="#ff7038" font-size="11" text-anchor="middle">one Ogcode step</text>
<path d="M684.7,392 L684.7,398 L890.0,398 L890.0,392" stroke="#6b6462" stroke-width="1.5" fill="none"/>
<text x="787.3" y="414.0" fill="#6b6462" font-size="11" text-anchor="middle">one advertised window</text>
</svg>
