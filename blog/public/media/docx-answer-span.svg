<svg xmlns="http://www.w3.org/2000/svg" width="960" height="592" viewBox="0 0 960 592" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="ttl dsc">
<title id="ttl">What a 500-token retrieval window can hold, measured on a 147-page .docx</title>
<desc id="dsc">Horizontal bars of the page text opened to answer each of 10 questions, from 814 to 1,692 tokens. A dashed line at 500 tokens marks one retrieval window and a dotted line at 854 marks the mean page. Every answer is longer than one window; the 7 answers that needed two pages are highlighted.</desc>
<rect width="960" height="592" fill="#151414"/>
<text x="40.0" y="32.0" fill="#fffbf5" font-size="14" font-weight="600" letter-spacing="0.4">What a 500-token window can hold</text>
<text x="40.0" y="54.0" fill="#9a9390" font-size="12">Page text opened per answer &#183; 10 questions on a 147-page .docx</text>
<rect x="40.0" y="72" width="10" height="10" rx="2" fill="#ff5e1f"/>
<text x="56.0" y="82.0" fill="#fffbf5" font-size="11.5">two pages (7)</text>
<rect x="174.7" y="72" width="10" height="10" rx="2" fill="#fffbf5"/>
<text x="190.7" y="82.0" fill="#fffbf5" font-size="11.5">one page (3)</text>
<line x1="302.2" y1="77.0" x2="322.2" y2="77.0" stroke="#ffc46b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="330.2" y="82.0" fill="#fffbf5" font-size="11.5">one retrieval window (500 tokens)</text>
<line x1="591.5" y1="77.0" x2="611.5" y2="77.0" stroke="#6b6462" stroke-width="1.5" stroke-dasharray="1.5 4"/>
<text x="619.5" y="82.0" fill="#fffbf5" font-size="11.5">mean page (854 tokens)</text>
<rect x="272.0" y="90" width="141.1" height="370" fill="#1d1b1a"/>
<line x1="272.0" y1="90.0" x2="272.0" y2="460.0" stroke="#2a2726" stroke-width="1"/>
<text x="272.0" y="478.0" fill="#9a9390" font-size="11.5" text-anchor="middle">0</text>
<line x1="413.1" y1="90.0" x2="413.1" y2="460.0" stroke="#2a2726" stroke-width="1"/>
<text x="413.1" y="478.0" fill="#9a9390" font-size="11.5" text-anchor="middle">500</text>
<line x1="554.2" y1="90.0" x2="554.2" y2="460.0" stroke="#2a2726" stroke-width="1"/>
<text x="554.2" y="478.0" fill="#9a9390" font-size="11.5" text-anchor="middle">1,000</text>
<line x1="695.3" y1="90.0" x2="695.3" y2="460.0" stroke="#2a2726" stroke-width="1"/>
<text x="695.3" y="478.0" fill="#9a9390" font-size="11.5" text-anchor="middle">1,500</text>
<line x1="413.1" y1="90.0" x2="413.1" y2="460.0" stroke="#ffc46b" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="513.0" y1="90.0" x2="513.0" y2="460.0" stroke="#6b6462" stroke-width="1.5" stroke-dasharray="1.5 4"/>
<text x="526.0" y="496.0" fill="#9a9390" font-size="11.5" text-anchor="middle">tokens of page text opened to answer &#183; linear scale</text>
<text x="24.0" y="112.0" fill="#fffbf5" font-size="12">Safe and idempotent methods</text>
<rect x="272.0" y="96" width="471.0" height="24" rx="3" fill="#ff5e1f"/>
<rect x="751.0" y="101" width="129.2" height="16" fill="#151414"/>
<text x="755.0" y="112.0" fill="#9a9390" font-size="11.5">1,669 &#183; pp. 53&#8211;54</text>
<text x="24.0" y="149.0" fill="#fffbf5" font-size="12">Expect: 100-continue</text>
<rect x="272.0" y="133" width="467.9" height="24" rx="3" fill="#ff5e1f"/>
<rect x="747.9" y="138" width="129.2" height="16" fill="#151414"/>
<text x="751.9" y="149.0" fill="#9a9390" font-size="11.5">1,658 &#183; pp. 63&#8211;64</text>
<text x="24.0" y="186.0" fill="#fffbf5" font-size="12">Cacheable by default</text>
<rect x="272.0" y="170" width="229.7" height="24" rx="3" fill="#fffbf5"/>
<rect x="509.7" y="175" width="93.6" height="16" fill="#151414"/>
<text x="513.7" y="186.0" fill="#9a9390" font-size="11.5">814 &#183; p.. 96</text>
<text x="24.0" y="223.0" fill="#fffbf5" font-size="12">Retry-After</text>
<rect x="272.0" y="207" width="477.5" height="24" rx="3" fill="#ff5e1f"/>
<rect x="757.5" y="212" width="129.2" height="16" fill="#151414"/>
<text x="761.5" y="223.0" fill="#9a9390" font-size="11.5">1,692 &#183; pp. 68&#8211;69</text>
<text x="24.0" y="260.0" fill="#fffbf5" font-size="12">URI origin</text>
<rect x="272.0" y="244" width="457.5" height="24" rx="3" fill="#ff5e1f"/>
<rect x="737.5" y="249" width="129.2" height="16" fill="#151414"/>
<text x="741.5" y="260.0" fill="#9a9390" font-size="11.5">1,621 &#183; pp. 16&#8211;17</text>
<text x="24.0" y="297.0" fill="#fffbf5" font-size="12">301, POST and 308</text>
<rect x="272.0" y="281" width="465.4" height="24" rx="3" fill="#ff5e1f"/>
<rect x="745.4" y="286" width="150.6" height="16" fill="#151414"/>
<text x="749.4" y="297.0" fill="#9a9390" font-size="11.5">1,649 &#183; pp. 104, 106</text>
<text x="24.0" y="334.0" fill="#fffbf5" font-size="12">Hop-by-hop headers</text>
<rect x="272.0" y="318" width="235.4" height="24" rx="3" fill="#fffbf5"/>
<rect x="515.4" y="323" width="93.6" height="16" fill="#151414"/>
<text x="519.4" y="334.0" fill="#9a9390" font-size="11.5">834 &#183; p.. 36</text>
<text x="24.0" y="371.0" fill="#fffbf5" font-size="12">405 and Allow</text>
<rect x="272.0" y="355" width="459.7" height="24" rx="3" fill="#ff5e1f"/>
<rect x="739.7" y="360" width="143.5" height="16" fill="#151414"/>
<text x="743.7" y="371.0" fill="#9a9390" font-size="11.5">1,629 &#183; pp. 107&#8211;108</text>
<text x="24.0" y="408.0" fill="#fffbf5" font-size="12">Required fields in 206</text>
<rect x="272.0" y="392" width="235.7" height="24" rx="3" fill="#fffbf5"/>
<rect x="515.7" y="397" width="100.7" height="16" fill="#151414"/>
<text x="519.7" y="408.0" fill="#9a9390" font-size="11.5">835 &#183; p.. 100</text>
<text x="24.0" y="445.0" fill="#fffbf5" font-size="12">Location rules</text>
<rect x="272.0" y="429" width="467.4" height="24" rx="3" fill="#ff5e1f"/>
<rect x="747.4" y="434" width="129.2" height="16" fill="#151414"/>
<text x="751.4" y="445.0" fill="#9a9390" font-size="11.5">1,656 &#183; pp. 67&#8211;68</text>
<text x="40.0" y="524.0" fill="#9a9390" font-size="11">Bars: the pages each answer actually opened, in tokens (characters &#247; 4). The shaded band is one 500-token chunk,</text>
<text x="40.0" y="540.0" fill="#9a9390" font-size="11">the unit a RAG pipeline retrieves. This document's shortest page is 624 tokens and its mean 854, so a window holds</text>
<text x="40.0" y="556.0" fill="#9a9390" font-size="11">less than a page, and no two-page answer fits whole in one. Ten answers, 17 page opens,</text>
<text x="40.0" y="572.0" fill="#9a9390" font-size="11">one page citation each. Two questions this file does not cover came back absent, not answered.</text>
</svg>
