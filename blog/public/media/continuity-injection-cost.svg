<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="ttl dsc">
<title id="ttl">What one turn of continuity costs, measured on 43 sessions</title>
<desc id="dsc">Grouped horizontal bars on a logarithmic scale from 7 to 4,000 tokens per continuity block. The shipped turn summaries run 72 tokens at best and 625 at worst, with a median of 290. The previous turn's final message verbatim runs 8 tokens at best and 3,264 at worst, with a median of 648. The summaries are cheaper in 33 of the 43 sessions; over all of them the totals are 12,980 against 39,932 tokens.</desc>
