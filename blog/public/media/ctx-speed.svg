<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="t d">
<title id="t">Chart of the wait before the first word, and the writing rate, against request size</title>
<desc id="d">One question, asked with growing amounts of text in front of it, on one model, from about 2,000 to about 974,000 tokens. Seconds to the first token climbs from 0.8 to 75 as the input grows. The writing rate stays broadly flat, between about 200 and 300 tokens a second, until the largest request. Two shaded bands mark the two decisions: a step of 5,000 to 20,000 tokens costs one to two seconds before the first token, and a request carrying a 128,000 to 1,000,000 token window costs six and a half to seventy five seconds.</desc>
<rect width="960" height="100%" fill="#151414"/>
<text x="40.0" y="36.0" fill="#fffbf5" font-size="15" font-weight="600" letter-spacing="0.3">The same question, asked with more text in front of it</text>
<text x="40.0" y="58.0" fill="#9a9390" font-size="12">Measured November 2026 · one model, one question · a fresh prompt every run, so nothing is served from cache</text>
<rect x="118" y="76" width="20" height="11" fill="#ff5e1f" opacity="0.16" stroke="#ff5e1f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="146.0" y="86.0" fill="#9a9390" font-size="12">5K–20K: one Ogcode step</text>
<rect x="118" y="94" width="20" height="11" fill="#fffbf5" opacity="0.09" stroke="#6b6462" stroke-width="1" stroke-dasharray="3 3"/>
<text x="146.0" y="104.0" fill="#9a9390" font-size="12">128K–1M: one request carrying the whole window</text>
<text x="118.0" y="136.0" fill="#fffbf5" font-size="15" font-weight="600">Seconds to the first token</text>
<text x="118.0" y="154.0" fill="#9a9390" font-size="12">the wait follows the size of the request, not the difficulty of the question</text>
