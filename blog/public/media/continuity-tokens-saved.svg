<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Same sessions, a third of the tokens</title>
<desc id="dsc">Two vertical bars on a linear scale: total tokens across 43 real sessions. The turn summaries total 12,980 tokens; the previous turn's final message verbatim totals 39,932, about 3.1 times as many. The difference of 26,952 tokens stays out of the request.</desc>
