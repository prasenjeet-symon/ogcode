<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Where the right session ranks, by query style</title>
<desc id="dsc">Grouped horizontal bars, measured on 446 sessions and 1,554 turn notes. First place ranges from 56.8 percent for a query built only from topic labels to 95.0 percent when the answer is spread across turns. The right session is in the top five at least 86.4 percent of the time, and always for body-word, plural and cross-turn questions.</desc>
