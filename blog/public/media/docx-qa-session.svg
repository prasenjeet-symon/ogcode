<text x="40.0" y="470.0" fill="#9a9390" font-size="11">Prompt tokens = characters &#247; 4. RAG: 500-token chunks, 50-token overlap, top-5 retrieved per question; its &#8776;125,550-token</text>
<text x="40.0" y="486.0" fill="#9a9390" font-size="11">embedding pass is background work, not conversation context. Ogcode reads the one or two pages a question needs, &#8776;1,400 in all.</text>
<text x="40.0" y="502.0" fill="#9a9390" font-size="11">Read whole instead of as a slice, the 40,000-token label catalogue does not beat retrieval until about question 36.</text>
