<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="ttl dsc">
<title id="ttl">What a QA session costs: cumulative prompt tokens over 30 questions on a 147-page .docx</title>
<desc id="dsc">Line chart on a logarithmic scale from 1,000 to 5,000,000 tokens. Dumping the whole document reaches about 3,766,500 tokens by question 30; retrieval about 75,000; opening the pages one answer needs, after a targeted label slice, about 47,600. The slice is dearer than retrieval until about question 6 and cheaper afterwards.</desc>
