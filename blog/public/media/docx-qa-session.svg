<text x="40.0" y="54.0" fill="#9a9390" font-size="12">Cumulative prompt tokens across questions</text>
<text x="920.0" y="32.0" fill="#9a9390" font-size="11.5" text-anchor="end">68,886 words &#183; 502,199 characters &#183; &#8776;125,550 tokens</text>
