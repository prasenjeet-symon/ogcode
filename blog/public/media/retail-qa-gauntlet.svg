<text x="570.1" y="350" fill="#9a9390" font-size="11.5" text-anchor="middle">q10</text>
<text x="337" y="374" fill="#9a9390" font-size="12" text-anchor="middle">tokens per answer</text>

<rect x="640" y="116" width="11" height="11" rx="2" fill="#ff7038"/>
<text x="659" y="126" fill="#9a9390" font-size="11.5">one answer &#183; one SQL query</text>
<text x="640" y="156" fill="#fffbf5" font-size="13.5" font-weight="600">all ten answers together:</text>
<text x="640" y="188" fill="#ff7038" font-size="26" font-weight="600">590 tokens</text>
<text x="640" y="210" fill="#9a9390" font-size="11.5">10 answers &#183; average 59 tokens</text>
<line x1="640" y1="230" x2="936" y2="230" stroke="#2a2726"/>
<text x="640" y="254" fill="#9a9390" font-size="11.5">the whole sheet as CSV, per question:</text>
<text x="640" y="282" fill="#6b6462" font-size="20" font-weight="600">2,090,000 tokens</text>
<text x="640" y="302" fill="#6b6462" font-size="11">21,000x past the 100-token axis &#183; the</text>
<text x="640" y="316" fill="#6b6462" font-size="11">context window cuts it long before the end</text>

<text x="78" y="400" fill="#9a9390" font-size="11">measured on the 100,000-row cut &#183; each answer is one query against the workbook on disk</text>
</svg>
