<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover extends the page under the notch/home indicator; the
       safe-area insets in styles/index.css then pad the chrome away from them.
       interactive-widget=resizes-content makes Android Chrome shrink the layout
       viewport for the keyboard (iOS gets the same effect via the visualViewport
       listener in lib/keyboard.ts). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#09090b" />
  <title>ogcode</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Fetch the UI typeface alongside the bundle rather than after the CSS
       parses, so the first paint is already Inter and text never reflows
       from the system fallback. Both faces are served from the binary. -->
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
