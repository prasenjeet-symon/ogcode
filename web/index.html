<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>ogcode</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Fetch the UI typeface alongside the bundle rather than after the CSS
       parses, so the first paint is already Inter and text never reflows
       from the system fallback. Both faces are served from the binary. -->
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
