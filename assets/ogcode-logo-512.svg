<!-- Raster master. Authored natively at 512 so an exporter never has to scale
     it: qlmanage (and some other converters) crop rather than fit when the
     intrinsic size and the viewBox disagree, which silently squares off three
     of the four corners. Regenerate the PNGs with:
       qlmanage -t -s 512 -o <dir> assets/ogcode-logo-512.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <rect width="512" height="512" rx="113" fill="#5E6AD2"/>
  <g transform="translate(92 92) scale(5.12)" color="#FFFFFF">
    <path d="M55 32A23 23 0 0 0 32 9A23 23 0 0 0 9 32A23 23 0 0 0 32 55A15 15 0 0 0 45 32"
          stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/>
  </g>
</svg>
